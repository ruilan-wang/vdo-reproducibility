name: Reproduction checks
on: [push, pull_request]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -c "import vdo"
      - run: python reproduce.py verify-data
      - run: python reproduce.py smoke
      - run: python reproduce.py figures
